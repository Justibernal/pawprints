<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - PawPrints</title>
  <meta name="description" content="Catálogo completo de libros de PawPrints.">
  <link rel="icon" href="img/placeholder.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
</head>
<body data-pagina="catalogo">
  <a class="salto" href="#contenido">Saltar al contenido</a>

  <header id="cabecera"></header>
  <nav id="menu" aria-label="Navegación principal"></nav>

  <main id="contenido" tabindex="-1">
    <noscript><p>PawPrints necesita JavaScript para mostrar el catálogo y las cuentas. Activalo en tu navegador y volvé a cargar la página.</p></noscript>
    <h1>Catálogo</h1>

    <form id="filtros" class="filtros" action="catalogo.html" method="get" aria-labelledby="filtros-titulo" novalidate>
      <h2 id="filtros-titulo" class="visualmente-oculto">Filtrar y ordenar</h2>
      <div class="aviso resumen-errores" tabindex="-1" hidden></div>
      <div class="aviso aviso-general" role="alert" tabindex="-1" hidden></div>
      <fieldset>
        <legend>Filtrar</legend>
        <div class="campo">
          <label for="genero">Género</label>
          <select id="genero" name="genero">
            <option value="">Todos</option>
            <option value="novela">Novela</option>
            <option value="cuento">Cuento</option>
            <option value="poesia">Poesía</option>
            <option value="infantil">Infantil</option>
          </select>
        </div>
        <div class="campo">
          <label for="autor">Autor</label>
          <input type="text" id="autor" name="autor" maxlength="100" autocomplete="off" placeholder="Nombre del autor">
        </div>
        <div class="campo">
          <label for="precio-max">Precio máximo (en pesos)</label>
          <input type="number" id="precio-max" name="precio_max" min="0" max="999999999" step="1" inputmode="numeric"
                 title="Ingresá un número entero de 0 en adelante." aria-describedby="precio-max-ayuda">
          <p class="ayuda" id="precio-max-ayuda">Dejalo vacío para ver todos los precios.</p>
        </div>
      </fieldset>

      <fieldset>
        <legend>Ordenar</legend>
        <div class="campo">
          <label for="orden">Ordenar por</label>
          <select id="orden" name="orden">
            <option value="relevancia">Relevancia</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
            <option value="titulo">Título (A-Z)</option>
          </select>
        </div>
        <div class="campo">
          <label for="per-page">Libros por página</label>
          <select id="per-page" name="per_page">
            <option value="6">6</option>
            <option value="12">12</option>
            <option value="24">24</option>
          </select>
        </div>
      </fieldset>

      <div class="barra">
        <button type="submit" data-ocupado="Buscando...">Aplicar filtros</button>
        <a class="btn secundario" href="catalogo.html">Quitar filtros</a>
      </div>
    </form>

    <section aria-labelledby="listado-titulo">
      <h2 id="listado-titulo">Libros disponibles</h2>
      <p id="estado-resultados"></p>
      <div id="resultados" aria-live="polite" aria-busy="true"></div>
    </section>
  </main>

  <footer id="pie"></footer>

  <script type="module" src="js/paginas/catalogo.js"></script>
</body>
</html>
