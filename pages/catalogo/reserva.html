<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PawPrints - Reservar Libro</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo"><h1>PawPrints 🐾</h1></div>
    <nav class="nav-links">
      <a href="../../index.html">Inicio</a>
      <a href="index.html">Catálogo</a>
    </nav>
  </header>

  <main class="container">
    <h2>Solicitar Reserva</h2>
    <div class="form-container">
      <form id="form-reserva">
        <div class="form-group">
          <label for="libro-id">ID o Código de Libro:</label>
          <input type="text" id="libro-id" required placeholder="Ej: 1">
        </div>
        <div class="form-group">
          <label for="usuario-nombre">Nombre Completo:</label>
          <input type="text" id="usuario-nombre" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label for="usuario-email">Correo Electrónico:</label>
          <input type="email" id="usuario-email" required placeholder="usuario@email.com">
        </div>
        <button type="submit" class="btn-primary">Confirmar Reserva</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PawPrints Library</p>
  </footer>

  <script type="module" src="../../js/controllers/reservaController.js"></script>
</body>
</html>
