<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar - PawPrints</title>
  <meta name="description" content="Ingresá a tu cuenta de PawPrints.">
  <link rel="icon" href="img/placeholder.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
</head>
<body data-pagina="login">
  <a class="salto" href="#contenido">Saltar al contenido</a>

  <header id="cabecera"></header>
  <nav id="menu" aria-label="Navegación principal"></nav>

  <main id="contenido" tabindex="-1">
    <noscript><p>PawPrints necesita JavaScript para mostrar el catálogo y las cuentas. Activalo en tu navegador y volvé a cargar la página.</p></noscript>
    <h1>Ingresar</h1>
    <p>Ingresá con tu correo y tu contraseña. Si todavía no tenés cuenta, <a href="registro.html">creala acá</a>.</p>

    <form id="form-login" method="post" action="login.html" novalidate>
      <div class="aviso resumen-errores" tabindex="-1" hidden></div>
      <div class="aviso aviso-general" role="alert" tabindex="-1" hidden></div>
      <div class="campo">
        <label for="email">Correo electrónico <span class="nota">(obligatorio)</span></label>
        <input type="email" id="email" name="email" required autocomplete="email" maxlength="254" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Ingresá un correo válido, por ejemplo nombre@dominio.com.">
      </div>
      <div class="campo">
        <label for="password">Contraseña <span class="nota">(obligatorio)</span></label>
        <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="72">
      </div>
      <p class="casilla">
        <input type="checkbox" id="mostrar-clave" class="mostrar-clave" data-destino="password">
        <label for="mostrar-clave">Mostrar contraseña</label>
      </p>
      <button type="submit" data-ocupado="Ingresando...">Ingresar</button>
    </form>
  </main>

  <footer id="pie"></footer>

  <script type="module" src="js/paginas/login.js"></script>
</body>
</html>
