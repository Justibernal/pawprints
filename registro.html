<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - PawPrints</title>
  <meta name="description" content="Creá tu cuenta en PawPrints.">
  <link rel="icon" href="img/placeholder.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
</head>
<body data-pagina="registro">
  <a class="salto" href="#contenido">Saltar al contenido</a>

  <header id="cabecera"></header>
  <nav id="menu" aria-label="Navegación principal"></nav>

  <main id="contenido" tabindex="-1">
    <noscript><p>PawPrints necesita JavaScript para mostrar el catálogo y las cuentas. Activalo en tu navegador y volvé a cargar la página.</p></noscript>
    <h1>Crear cuenta</h1>
    <p>Con tu cuenta podés ingresar cuando quieras. Si ya tenés una, <a href="login.html">ingresá acá</a>.</p>

    <form id="form-registro" method="post" action="registro.html" novalidate>
      <div class="aviso resumen-errores" tabindex="-1" hidden></div>
      <div class="aviso aviso-general" role="alert" tabindex="-1" hidden></div>
      <div class="campo">
        <label for="nombre">Nombre <span class="nota">(obligatorio)</span></label>
        <input type="text" id="nombre" name="nombre" required aria-describedby="nombre-ayuda" autocomplete="name" maxlength="80">
        <p class="ayuda" id="nombre-ayuda">Hasta 80 caracteres.</p>
      </div>
      <div class="campo">
        <label for="email">Correo electrónico <span class="nota">(obligatorio)</span></label>
        <input type="email" id="email" name="email" required aria-describedby="email-ayuda" autocomplete="email" maxlength="254" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Ingresá un correo válido, por ejemplo nombre@dominio.com.">
        <p class="ayuda" id="email-ayuda">Por ejemplo: nombre@dominio.com</p>
      </div>
      <div class="campo">
        <label for="password">Contraseña <span class="nota">(obligatorio)</span></label>
        <input type="password" id="password" name="password" required aria-describedby="password-ayuda" autocomplete="new-password" minlength="8" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,72}" title="Entre 8 y 72 caracteres, con al menos una letra y un número.">
        <p class="ayuda" id="password-ayuda">Entre 8 y 72 caracteres, con al menos una letra y un número.</p>
      </div>
      <div class="campo">
        <label for="password-confirm">Repetir contraseña <span class="nota">(obligatorio)</span></label>
        <input type="password" id="password-confirm" name="password_confirm" required autocomplete="new-password" maxlength="72">
      </div>
      <p class="casilla">
        <input type="checkbox" id="mostrar-clave" class="mostrar-clave" data-destino="password password-confirm">
        <label for="mostrar-clave">Mostrar contraseñas</label>
      </p>
      <button type="submit" data-ocupado="Creando cuenta...">Crear cuenta</button>
    </form>
  </main>

  <footer id="pie"></footer>

  <script type="module" src="js/paginas/registro.js"></script>
</body>
</html>
